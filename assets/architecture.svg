<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Arquitectura de referencia: visión por computador en tiempo real</title><desc id="d">Cámaras RTSP pasan por un normalizador y un relay en alta disponibilidad hacia DeepStream en un StatefulSet con una GPU por pod; las detecciones se publican en NATS, que reparte a workers de rostros, objetos abandonados, merodeo y pose, a un router FastAPI y a un relay H.264. El router persiste en PostgreSQL con pgvector y almacenamiento de objetos, y sirve un frontend Angular y alertas por Telegram.</desc><style>
