<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="916" viewBox="0 0 1000 916" role="img" aria-labelledby="t d"><title id="t">Catálogo de sistemas</title><desc id="d">Sistemas diseñados por Sebastian Guarnizo: Rancho Smart (plataforma ganadera · tesis); TuApo Platform (monolito → microservicios); Vision AI (visión por computador · tiempo real); Laplace (saas ágil multi-tenant); Voryes (gestión documental); Scripta (verificación de antecedentes); Tend (hábitos + finanzas personales); AI Dev Agents (agentes de ia en el sdlc)</desc><style>
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1E293B" stroke-width=".6" opacity=".55"/></pattern><radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 40) scale(520 360)"><stop stop-color="#22D3EE" stop-opacity=".16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 856) scale(520 380)"><stop stop-color="#A78BFA" stop-opacity=".16"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><clipPath id="clip"><rect width="1000" height="916" rx="16"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1000" height="916" fill="#0B1020"/><rect width="1000" height="916" fill="url(#glowA)"/><rect width="1000" height="916" fill="url(#glowB)"/></g><rect x=".5" y=".5" width="999" height="915" rx="15.5" fill="none" stroke="#1E293B"/><text x="28" y="44" class="m" fill="#22D3EE" font-size="11" letter-spacing="2">SERVICE CATALOG</text><text x="28" y="74" class="s" fill="#F1F5F9" font-size="24" font-weight="650">Sistemas que he diseñado y construido</text><text x="972" y="44" text-anchor="end" class="m" fill="#64748B" font-size="11">8 sistemas · owner: sebastian0912</text><g><rect x="28" y="96" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="28" y="114" width="3" height="34" rx="1.5" fill="#3987e5"/><text x="50" y="126" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">01 · PLATAFORMA GANADERA · TESIS</text><text x="50" y="152" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Rancho Smart</text><g transform="translate(371.2 112)"><rect x="0.0" y="0" width="102.8" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="51.4" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">microservicios</text></g><text x="50" y="180" class="s" fill="#94A3B8" font-size="13.5">46 repositorios: 27 microservicios de dominio orquestados por</text><text x="50" y="199" class="s" fill="#94A3B8" font-size="13.5">composers, API Gateway, Eureka, Config Server y sincronización por</text><text x="50" y="218" class="s" fill="#94A3B8" font-size="13.5">eventos en Kafka; optimización de cruces en Python.</text><rect x="50.0" y="244" width="94.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="97.1" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Spring Cloud</text><rect x="152.1" y="244" width="48.5" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="176.4" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Kafka</text><rect x="208.7" y="244" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="239.5" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Angular</text><rect x="278.2" y="244" width="55.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="305.8" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Python</text></g><g><rect x="514" y="96" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="514" y="114" width="3" height="34" rx="1.5" fill="#d95926"/><text x="536" y="126" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">02 · MONOLITO → MICROSERVICIOS</text><text x="536" y="152" class="s" fill="#F1F5F9" font-size="21" font-weight="650">TuApo Platform</text><g transform="translate(863.4 112)"><rect x="0.0" y="0" width="96.6" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="48.3" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">strangler fig</text></g><text x="536" y="180" class="s" fill="#94A3B8" font-size="13.5">Migración de un monolito Django a 7 dominios (auth, nómina, RR.</text><text x="536" y="199" class="s" fill="#94A3B8" font-size="13.5">HH., documental, automatización, IA) con base de datos por</text><text x="536" y="218" class="s" fill="#94A3B8" font-size="13.5">servicio, gateway, eventos Kafka y workers de OCR y RPA.</text><rect x="536.0" y="244" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="566.8" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Java 21</text><rect x="605.6" y="244" width="146.2" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="678.7" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Spring Cloud Gateway</text><rect x="759.8" y="244" width="48.5" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="784.0" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Kafka</text><rect x="816.3" y="244" width="48.5" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="840.6" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">MySQL</text></g><g><rect x="28" y="298" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="28" y="316" width="3" height="34" rx="1.5" fill="#199e70"/><text x="50" y="328" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">03 · VISIÓN POR COMPUTADOR · TIEMPO REAL</text><text x="50" y="354" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Vision AI</text><g transform="translate(402.2 314)"><rect x="0.0" y="0" width="71.8" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="35.9" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">GPU · k8s</text></g><text x="50" y="382" class="s" fill="#94A3B8" font-size="13.5">Cámaras RTSP → DeepStream en Kubernetes (1 GPU por pod, sharding</text><text x="50" y="401" class="s" fill="#94A3B8" font-size="13.5">por cámara) → NATS → workers especializados → FastAPI + pgvector,</text><text x="50" y="420" class="s" fill="#94A3B8" font-size="13.5">con video en vivo vía WebCodecs.</text><rect x="50.0" y="446" width="81.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="90.5" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Kubernetes</text><rect x="139.1" y="446" width="81.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="179.6" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">DeepStream</text><rect x="228.2" y="446" width="42.0" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="249.2" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">NATS</text><rect x="278.2" y="446" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="309.0" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">FastAPI</text></g><g><rect x="514" y="298" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="514" y="316" width="3" height="34" rx="1.5" fill="#c98500"/><text x="536" y="328" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">04 · SAAS ÁGIL MULTI-TENANT</text><text x="536" y="354" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Laplace</text><g transform="translate(869.6 314)"><rect x="0.0" y="0" width="90.4" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="45.2" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">multi-tenant</text></g><text x="536" y="382" class="s" fill="#94A3B8" font-size="13.5">Scrum y Kanban para empresas y universidades. Un solo producto con</text><text x="536" y="401" class="s" fill="#94A3B8" font-size="13.5">despliegue dual: contenedor en la nube y escritorio con el backend</text><text x="536" y="420" class="s" fill="#94A3B8" font-size="13.5">Java embebido en Electron.</text><rect x="536.0" y="446" width="87.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="579.8" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Spring Boot</text><rect x="631.6" y="446" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="662.4" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Angular</text><rect x="701.2" y="446" width="68.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="735.2" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Electron</text><rect x="777.3" y="446" width="81.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="817.8" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">PostgreSQL</text></g><g><rect x="28" y="500" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="28" y="518" width="3" height="34" rx="1.5" fill="#3987e5"/><text x="50" y="530" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">05 · GESTIÓN DOCUMENTAL</text><text x="50" y="556" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Voryes</text><g transform="translate(402.2 516)"><rect x="0.0" y="0" width="71.8" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="35.9" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">hexagonal</text></g><text x="50" y="584" class="s" fill="#94A3B8" font-size="13.5">Núcleo hexagonal en 4 módulos Maven con OCR, servido en web,</text><text x="50" y="603" class="s" fill="#94A3B8" font-size="13.5">escritorio y móvil (Capacitor) sobre el mismo dominio; respaldos y</text><text x="50" y="622" class="s" fill="#94A3B8" font-size="13.5">despliegue de nube automatizados.</text><rect x="50.0" y="648" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="80.8" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Java 21</text><rect x="119.6" y="648" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="150.4" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Angular</text><rect x="189.1" y="648" width="74.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="226.4" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Capacitor</text><rect x="271.7" y="648" width="35.5" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="289.5" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">OCR</text></g><g><rect x="514" y="500" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="514" y="518" width="3" height="34" rx="1.5" fill="#d95926"/><text x="536" y="530" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">06 · VERIFICACIÓN DE ANTECEDENTES</text><text x="536" y="556" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Scripta</text><g transform="translate(838.6 516)"><rect x="0.0" y="0" width="121.4" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="60.7" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">privacy by design</text></g><text x="536" y="584" class="s" fill="#94A3B8" font-size="13.5">8 fuentes oficiales consultadas por un motor externo con contrato</text><text x="536" y="603" class="s" fill="#94A3B8" font-size="13.5">HTTP de 5 rutas. Evidencias con huella digital y retención que se</text><text x="536" y="622" class="s" fill="#94A3B8" font-size="13.5">borra sola: no existe base de antecedentes.</text><rect x="536.0" y="648" width="87.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="579.8" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Spring Boot</text><rect x="631.6" y="648" width="81.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="672.2" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Angular 22</text><rect x="720.7" y="648" width="81.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="761.3" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Playwright</text><rect x="809.8" y="648" width="68.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="843.9" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Electron</text></g><g><rect x="28" y="702" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="28" y="720" width="3" height="34" rx="1.5" fill="#199e70"/><text x="50" y="732" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">07 · HÁBITOS + FINANZAS PERSONALES</text><text x="50" y="758" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Tend</text><g transform="translate(389.8 718)"><rect x="0.0" y="0" width="84.2" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="42.1" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">local-first</text></g><text x="50" y="786" class="s" fill="#94A3B8" font-size="13.5">Los datos viven en el dispositivo (IndexedDB) y la app completa</text><text x="50" y="805" class="s" fill="#94A3B8" font-size="13.5">funciona sin conexión. Un mismo frontend Angular empaquetado para</text><text x="50" y="824" class="s" fill="#94A3B8" font-size="13.5">escritorio y Android.</text><rect x="50.0" y="850" width="81.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="90.5" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Angular 22</text><rect x="139.1" y="850" width="48.5" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="163.4" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Dexie</text><rect x="195.6" y="850" width="68.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="229.7" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Electron</text><rect x="271.7" y="850" width="74.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="309.0" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Capacitor</text></g><g><rect x="514" y="702" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="514" y="720" width="3" height="34" rx="1.5" fill="#c98500"/><text x="536" y="732" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">08 · AGENTES DE IA EN EL SDLC</text><text x="536" y="758" class="s" fill="#F1F5F9" font-size="21" font-weight="650">AI Dev Agents</text><g transform="translate(832.4 718)"><rect x="0.0" y="0" width="127.6" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="63.8" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">plataforma interna</text></g><text x="536" y="786" class="s" fill="#94A3B8" font-size="13.5">Puente que orquesta un pool de agentes de desarrollo con cola,</text><text x="536" y="805" class="s" fill="#94A3B8" font-size="13.5">vigilantes y worktrees aislados, gobernado desde la plataforma con</text><text x="536" y="824" class="s" fill="#94A3B8" font-size="13.5">permisos por rol.</text><rect x="536.0" y="850" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="566.8" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Node.js</text><rect x="605.6" y="850" width="87.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="649.4" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Claude Code</text><rect x="701.2" y="850" width="35.5" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="718.9" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">MCP</text><rect x="744.7" y="850" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="775.5" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">systemd</text></g></svg>