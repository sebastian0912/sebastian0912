<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="916" viewBox="0 0 1000 916" role="img" aria-labelledby="t d"><title id="t">Catálogo de sistemas</title><desc id="d">Sistemas en los que ha trabajado Sebastian Guarnizo: Plataforma de gestión ganadera (proyecto de grado); Modernización empresarial (rr. hh. y nómina); Analítica de video con IA (videovigilancia); Gestión ágil para equipos (producto saas); Gestión documental (producto); Verificación de antecedentes (cumplimiento); Hábitos y finanzas personales (app personal); Agentes de IA para desarrollo (ia en el sdlc)</desc><style>
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1E293B" stroke-width=".6" opacity=".55"/></pattern><radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(120 40) scale(520 360)"><stop stop-color="#22D3EE" stop-opacity=".16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 856) scale(520 380)"><stop stop-color="#A78BFA" stop-opacity=".16"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><clipPath id="clip"><rect width="1000" height="916" rx="16"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1000" height="916" fill="#0B1020"/><rect width="1000" height="916" fill="url(#glowA)"/><rect width="1000" height="916" fill="url(#glowB)"/></g><rect x=".5" y=".5" width="999" height="915" rx="15.5" fill="none" stroke="#1E293B"/><text x="28" y="44" class="m" fill="#22D3EE" font-size="11" letter-spacing="2">SERVICE CATALOG</text><text x="28" y="74" class="s" fill="#F1F5F9" font-size="24" font-weight="650">Sistemas que he diseñado o en los que he participado</text><text x="972" y="44" text-anchor="end" class="m" fill="#64748B" font-size="11">8 sistemas</text><g><rect x="28" y="96" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="28" y="114" width="3" height="34" rx="1.5" fill="#3987e5"/><text x="50" y="126" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">01 · PROYECTO DE GRADO</text><text x="50" y="152" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Plataforma de gestión ganadera</text><g transform="translate(371.2 112)"><rect x="0.0" y="0" width="102.8" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="51.4" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">microservicios</text></g><text x="50" y="180" class="s" fill="#94A3B8" font-size="13.5">Diseñé una plataforma para administrar fincas —salud animal,</text><text x="50" y="199" class="s" fill="#94A3B8" font-size="13.5">producción, ventas y finanzas— con servicios independientes que se</text><text x="50" y="218" class="s" fill="#94A3B8" font-size="13.5">comunican por eventos.</text><rect x="50.0" y="244" width="107.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="103.6" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Microservicios</text><rect x="165.1" y="244" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="195.9" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Eventos</text><rect x="234.7" y="244" width="42.0" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="255.7" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Java</text></g><g><rect x="514" y="96" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="514" y="114" width="3" height="34" rx="1.5" fill="#d95926"/><text x="536" y="126" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">02 · RR. HH. Y NÓMINA</text><text x="536" y="152" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Modernización empresarial</text><g transform="translate(863.4 112)"><rect x="0.0" y="0" width="96.6" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="48.3" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">strangler fig</text></g><text x="536" y="180" class="s" fill="#94A3B8" font-size="13.5">Migración gradual de un monolito a servicios por dominio (nómina,</text><text x="536" y="199" class="s" fill="#94A3B8" font-size="13.5">contratación, documentos, automatización) sin detener la operación</text><text x="536" y="218" class="s" fill="#94A3B8" font-size="13.5">diaria de la empresa.</text><rect x="536.0" y="244" width="42.0" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="557.0" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Java</text><rect x="586.0" y="244" width="55.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="613.6" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Python</text><rect x="649.1" y="244" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="679.9" y="258.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Eventos</text></g><g><rect x="28" y="298" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="28" y="316" width="3" height="34" rx="1.5" fill="#199e70"/><text x="50" y="328" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">03 · VIDEOVIGILANCIA</text><text x="50" y="354" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Analítica de video con IA</text><g transform="translate(389.8 314)"><rect x="0.0" y="0" width="84.2" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="42.1" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">tiempo real</text></g><text x="50" y="382" class="s" fill="#94A3B8" font-size="13.5">Participé en una plataforma que analiza cámaras de seguridad en</text><text x="50" y="401" class="s" fill="#94A3B8" font-size="13.5">tiempo real para detectar eventos y generar alertas, desplegada</text><text x="50" y="420" class="s" fill="#94A3B8" font-size="13.5">sobre infraestructura con GPU.</text><rect x="50.0" y="446" width="152.7" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="126.4" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Visión por computador</text><rect x="210.7" y="446" width="55.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="238.2" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Python</text><rect x="273.8" y="446" width="81.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="314.3" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Kubernetes</text></g><g><rect x="514" y="298" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="514" y="316" width="3" height="34" rx="1.5" fill="#c98500"/><text x="536" y="328" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">04 · PRODUCTO SAAS</text><text x="536" y="354" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Gestión ágil para equipos</text><g transform="translate(869.6 314)"><rect x="0.0" y="0" width="90.4" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="45.2" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">multi-tenant</text></g><text x="536" y="382" class="s" fill="#94A3B8" font-size="13.5">Herramienta Scrum y Kanban multiempresa para compañías,</text><text x="536" y="401" class="s" fill="#94A3B8" font-size="13.5">universidades y equipos pequeños; funciona en la nube o instalada</text><text x="536" y="420" class="s" fill="#94A3B8" font-size="13.5">en el equipo.</text><rect x="536.0" y="446" width="87.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="579.8" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Spring Boot</text><rect x="631.6" y="446" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="662.4" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Angular</text><rect x="701.2" y="446" width="68.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="735.2" y="460.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Electron</text></g><g><rect x="28" y="500" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="28" y="518" width="3" height="34" rx="1.5" fill="#3987e5"/><text x="50" y="530" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">05 · PRODUCTO</text><text x="50" y="556" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Gestión documental</text><g transform="translate(402.2 516)"><rect x="0.0" y="0" width="71.8" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="35.9" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">hexagonal</text></g><text x="50" y="584" class="s" fill="#94A3B8" font-size="13.5">Organiza, indexa y encuentra documentos con OCR desde web,</text><text x="50" y="603" class="s" fill="#94A3B8" font-size="13.5">escritorio y móvil, compartiendo un mismo núcleo de negocio.</text><rect x="50.0" y="648" width="42.0" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="71.0" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Java</text><rect x="100.0" y="648" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="130.8" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Angular</text><rect x="169.6" y="648" width="35.5" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="187.4" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">OCR</text></g><g><rect x="514" y="500" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="514" y="518" width="3" height="34" rx="1.5" fill="#d95926"/><text x="536" y="530" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">06 · CUMPLIMIENTO</text><text x="536" y="556" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Verificación de antecedentes</text><g transform="translate(838.6 516)"><rect x="0.0" y="0" width="121.4" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="60.7" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">privacy by design</text></g><text x="536" y="584" class="s" fill="#94A3B8" font-size="13.5">Automatiza consultas a fuentes oficiales y entrega reportes con</text><text x="536" y="603" class="s" fill="#94A3B8" font-size="13.5">evidencias. Diseñado desde la privacidad: no conserva datos más</text><text x="536" y="622" class="s" fill="#94A3B8" font-size="13.5">allá de lo necesario.</text><rect x="536.0" y="648" width="42.0" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="557.0" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Java</text><rect x="586.0" y="648" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="616.8" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Angular</text><rect x="655.6" y="648" width="107.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="709.2" y="662.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Automatización</text></g><g><rect x="28" y="702" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="28" y="720" width="3" height="34" rx="1.5" fill="#199e70"/><text x="50" y="732" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">07 · APP PERSONAL</text><text x="50" y="758" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Hábitos y finanzas personales</text><g transform="translate(389.8 718)"><rect x="0.0" y="0" width="84.2" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="42.1" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">local-first</text></g><text x="50" y="786" class="s" fill="#94A3B8" font-size="13.5">Cruza hábitos y gastos personales. Los datos viven en el</text><text x="50" y="805" class="s" fill="#94A3B8" font-size="13.5">dispositivo y la app funciona completa sin conexión, en escritorio</text><text x="50" y="824" class="s" fill="#94A3B8" font-size="13.5">y Android.</text><rect x="50.0" y="850" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="80.8" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Angular</text><rect x="119.6" y="850" width="68.1" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="153.6" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Electron</text><rect x="195.6" y="850" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="226.4" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Android</text></g><g><rect x="514" y="702" width="466" height="186" rx="12" fill="#0F172A" stroke="#1E293B"/><rect x="514" y="720" width="3" height="34" rx="1.5" fill="#c98500"/><text x="536" y="732" class="m" fill="#64748B" font-size="10" letter-spacing="1.5">08 · IA EN EL SDLC</text><text x="536" y="758" class="s" fill="#F1F5F9" font-size="21" font-weight="650">Agentes de IA para desarrollo</text><g transform="translate(832.4 718)"><rect x="0.0" y="0" width="127.6" height="20" rx="10.0" fill="#A78BFA14" stroke="#A78BFA" stroke-opacity=".55"/><text x="63.8" y="13.6" text-anchor="middle" class="m" fill="#A78BFA" font-size="10">plataforma interna</text></g><text x="536" y="786" class="s" fill="#94A3B8" font-size="13.5">Orquesta agentes de IA que trabajan sobre copias aisladas del</text><text x="536" y="805" class="s" fill="#94A3B8" font-size="13.5">código, con cola de tareas y permisos controlados desde la</text><text x="536" y="824" class="s" fill="#94A3B8" font-size="13.5">plataforma.</text><rect x="536.0" y="850" width="61.6" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="566.8" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Node.js</text><rect x="605.6" y="850" width="29.0" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="620.1" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">IA</text><rect x="642.6" y="850" width="48.5" height="22" rx="11.0" fill="#ffffff08" stroke="#CBD5E1" stroke-opacity=".55"/><text x="666.9" y="864.8" text-anchor="middle" class="m" fill="#CBD5E1" font-size="10.5">Linux</text></g></svg>