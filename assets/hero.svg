<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Sebastian Guarnizo Campos — Software &amp; Cloud Architect</title><desc id="d">Arquitecto de software y nube (AWS y Azure), Senior Software Engineer en Bogotá. Diagrama animado de una topología multinube: clientes, edge, API gateway, servicios en EKS y AKS, bus de eventos y datos.</desc><style>
.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Inter,Helvetica,Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Consolas,'Liberation Mono',monospace}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.pulse{animation:pulse 2s ease-in-out infinite}
.caret{animation:blink 1.05s steps(1) infinite}
