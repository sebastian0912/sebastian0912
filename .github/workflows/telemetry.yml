name: Telemetry

on:
  schedule:
    - cron: "17 6 * * *" # una vez al día
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/telemetry.py, .github/workflows/telemetry.yml]

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # METRICS_TOKEN (opcional): token personal de solo lectura para sumar los
      # lenguajes de los repos privados. Sin él, solo cuenta lo público.
      - name: Render telemetry.svg
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/telemetry.py ${{ github.repository_owner }} dist/telemetry.svg

      - name: Publish to output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telemetry.svg
          git commit -q -m "telemetry: $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
